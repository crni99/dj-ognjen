<!DOCTYPE html>
<html lang="sr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Stranica nije pronađena (404) | DJ Ognjen</title>
    <meta name="description" content="Stranica nije pronađena. Vratite se na početnu stranu sajta DJ Ognjen.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style"
        href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700;800&family=Hanken+Grotesk:wght@400;500;700&display=swap">
    <link
        href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700;800&family=Hanken+Grotesk:wght@400;500;700&display=swap"
        rel="stylesheet" media="print" onload="this.media='all'">
    <noscript>
        <link
            href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700;800&family=Hanken+Grotesk:wght@400;500;700&display=swap"
            rel="stylesheet">
    </noscript>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/consent.css">
</head>

<body style="display: flex; flex-direction: column; min-height: 100vh; margin: 0;">

    <header>
        <div class="wrap bar">
            <a class="brand" href="/" aria-label="DJ Ognjen, početna strana">
                <img src="/img/logo.webp" alt="DJ Ognjen logo: glava sa slušalicama i naočarima">DJ Ognjen
            </a>
            <button class="menu-toggle" aria-label="Otvori/Zatvori meni">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <nav aria-label="Glavna navigacija" id="main-nav">
                <a href="/">Početna</a>
                <a href="/dj-za-zurke-i-klubove">DJ za žurke i klubove</a>
                <a href="/dj-za-rodjendane">DJ za rođendane</a>
                <a href="/dj-za-svadbe">DJ za svadbe</a>
                <a class="btn solid sm" href="/#kontakt" data-ga-event="nav_rezervisi_click"
                    data-ga-location="404_header">Rezervišite</a>
            </nav>
        </div>
    </header>

    <main style="flex: 1; display: flex; align-items: center; justify-content: center; text-align: center;">
        <div class="wrap"
            style="max-width: 700px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 20px;">
            <span style="font-size: 5rem; font-weight: 800; color: var(--gold); line-height: 1;">404</span>
            <h1 style="font-size: clamp(1.8rem, 3vw, 2.5rem); margin: 0;">Ups! Ova stranica je zalutala sa ritma.</h1>
            <p class="muted" style="font-size: 1.1rem; max-width: 500px; margin: 0 0 10px 0;">
                Izgleda da link koji ste tražili ne postoji ili je premešten. Vratite se na početnu stranu i nastavite
                provod.
            </p>
            <div style="display: flex; gap: 15px; flex-wrap: wrap; justify-content: center;">
                <a href="/" class="btn solid">Nazad na početnu</a>
            </div>
        </div>
    </main>

    <footer>
        <div class="wrap">
            <div class="footer-left">
                <span class="brand-mini">
                    <img src="/img/logo.webp" alt="DJ Ognjen logo">&copy; 2026 DJ Ognjen. Sva prava zadržana.
                </span>
            </div>
            <button type="button" data-cookie-settings
                style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:0.9rem;">
                Podešavanje kolačića
            </button>
        </div>
    </footer>

    <script src="/js/menu.js" defer></script>
    <script src="/js/consent.js" defer></script>

</body>

</html>
